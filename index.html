<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="theme-color" content="#7c4dff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SystemHub">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%237c4dff'/><text x='50' y='55' text-anchor='middle' fill='white' font-size='40'>S</text></svg>">
    <link rel="manifest" href="manifest.json">
    
    <title>My System Hub</title>
    <style>
        /* CSS VARIABLES & THEMING */
        :root {
            --bg: #0b0b0e; --card: #15151a; --border: #2a2a32; --text-main: #e1e1e6;
            --text-dim: #a1a1aa; --accent: #7c4dff; --danger: #ff5252; --success: #69f0ae;
        }

        [data-theme="light"] { --bg: #f0f2f5; --card: #ffffff; --border: #dcdde1; --text-main: #2f3640; --text-dim: #7f8c8d; --accent: #4834d4; }
        [data-theme="soft"] { --bg: #2d3436; --card: #353b48; --border: #4b515d; --accent: #fab1a0; --text-main: #dfe6e9; }

        * { box-sizing: border-box; transition: background 0.3s, border 0.3s; -webkit-tap-highlight-color: transparent; }

        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding-bottom: 80px; line-height: 1.6; }

        .navbar { background-color: var(--card); border-bottom: 1px solid var(--border); padding: env(safe-area-inset-top) 20px 0 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; height: 60px; }
        .nav-brand { font-weight: 800; font-size: 1.1rem; color: var(--accent); letter-spacing: 1px; }
        .nav-links { display: flex; gap: 5px; height: 100%; }
        .nav-btn { background: transparent; border: none; color: var(--text-dim); padding: 0 15px; cursor: pointer; font-weight: 600; font-size: 0.85rem; display: flex; align-items: center; height: 100%; border-bottom: 3px solid transparent; }
        .nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(124, 77, 255, 0.1); }

        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .view { display: none; animation: fadeIn 0.4s ease; }
        .view.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .front-hero { background: linear-gradient(135deg, var(--card) 0%, #101014 100%); border: 1px solid var(--border); border-radius: 20px; padding: 30px; margin-bottom: 30px; }
        .fronters-container { display: flex; flex-direction: column; gap: 10px; }
        
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .member-card { background: var(--card); border: 1px solid var(--border); border-radius: 15px; overflow: hidden; }
        .member-banner { height: 80px; background: var(--accent); opacity: 0.2; }
        .member-content { padding: 15px; position: relative; margin-top: -40px; }
        .member-pfp { width: 70px; height: 70px; border-radius: 12px; border: 4px solid var(--card); object-fit: cover; background: #252525; }

        .btn { border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-danger { background: rgba(255, 82, 82, 0.1); color: var(--danger); }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; }
        input, select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text-main); padding: 12px; border-radius: 8px; font-size: 1rem; }

        .log-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .log-table th, .log-table td { padding: 12px; border-bottom: 1px solid var(--border); text-align: left; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: var(--card); width: 90%; max-width: 500px; padding: 30px; border-radius: 20px; border: 1px solid var(--border); }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 0.7rem; padding: 4px 8px; border-radius: 6px; background: var(--border); }

        @media (max-width: 768px) {
            .container { padding: 0 15px; } .navbar { padding: 0 10px; height: 50px; } .nav-brand { font-size: 1rem; } .nav-btn { padding: 0 10px; font-size: 0.75rem; } .grid { grid-template-columns: 1fr; gap: 15px; }
        }
    </style>
</head>
<body id="app-body">

    <nav class="navbar">
        <div class="nav-brand">My System</div>
        <div class="nav-links">
            <button class="nav-btn active" onclick="switchTab('dash', event)">Dash</button>
            <button class="nav-btn" onclick="switchTab('members', event)">Directory</button>
            <button class="nav-btn" onclick="switchTab('history', event)">Log</button>
            <button class="nav-btn" onclick="switchTab('settings', event)">Settings</button>
        </div>
    </nav>

    <div class="container" id="main-container">
        <div id="dash" class="view active">
            <div class="front-hero">
                <span style="color: var(--accent); font-weight: 800; font-size: 0.8rem; text-transform: uppercase;">Current Front</span>
                <div id="active-fronters-list" class="fronters-container" style="margin-top: 15px;"></div>
            </div>

            <div class="flex-between" style="margin-bottom: 15px;">
                <h2 style="font-size: 0.9rem; text-transform: uppercase; color: var(--text-dim);">Quick Switch</h2>
                <button class="btn btn-outline" style="font-size: 0.7rem;" onclick="clearFront()">Clear All</button>
            </div>
            <div id="quick-grid" class="grid"></div>
        </div>

        <div id="members" class="view">
            <div class="flex-between" style="margin-bottom: 25px;">
                <h1>Directory</h1>
                <button class="btn btn-primary" onclick="openMemberModal()">+ Add</button>
            </div>
            <div id="directory-grid" class="grid"></div>
        </div>

        <div id="history" class="view">
            <h1>Log</h1>
            <div class="card">
                <table class="log-table">
                    <tbody id="history-log-body"></tbody>
                </table>
                <button class="btn btn-danger" style="margin-top: 20px; width: 100%;" onclick="clearLogs()">Clear History</button>
            </div>
        </div>

        <div id="settings" class="view">
            <h1>Settings</h1>
            <div class="card">
                <label>UI Theme</label>
                <select id="theme-selector" onchange="changeTheme(this.value)">
                    <option value="dark">Midnight</option>
                    <option value="light">Daylight</option>
                    <option value="soft">Soft Forest</option>
                </select>
            </div>
            <div class="card">
                <label>Backup Data</label>
                <textarea id="system-key-box" readonly rows="3" style="font-family: monospace; font-size: 0.7rem;"></textarea>
                <div class="flex-between" style="margin-top: 10px; gap: 10px;">
                    <button class="btn btn-outline" style="flex:1" onclick="generateKey()">Generate</button>
                    <button class="btn btn-outline" style="flex:1" onclick="importData()">Import</button>
                </div>
            </div>
        </div>
    </div>

    <div id="member-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title">New Member</h2>
            <form id="member-form">
                <input type="hidden" id="edit-index" value="-1">
                <div class="form-group"><label>Image</label><input type="file" id="m-pfp" accept="image/*"></div>
                <div class="form-group"><label>Name</label><input type="text" id="m-name" required></div>
                <div class="form-group"><label>Role</label><input type="text" id="m-role"></div>
                <div class="flex-between" style="gap: 10px;">
                    <button type="button" class="btn btn-outline" style="flex:1" onclick="closeMemberModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="flex:1">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="front-action-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 320px; text-align: center; padding: 25px;">
            <h2 id="fa-name" style="margin-top: 0; margin-bottom: 5px;">Member Name</h2>
            <p style="font-size: 0.85rem; color: var(--text-dim); margin-bottom: 25px;">Update fronting status</p>
            
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <button class="btn btn-primary" onclick="confirmFrontStatus('Primary Fronter')">Set as Primary Fronter</button>
                <button class="btn btn-outline" onclick="confirmFrontStatus('Co-Fronter')">Set as Co-Fronter</button>
                
                <div style="display: flex; gap: 8px; margin-top: 5px;">
                    <input type="text" id="fa-custom-status" placeholder="Custom role..." style="flex: 2; padding: 10px; font-size: 0.9rem;">
                    <button class="btn btn-outline" style="flex: 1; padding: 10px;" onclick="confirmFrontStatus('Custom')">Set</button>
                </div>

                <button class="btn btn-danger" id="fa-remove-btn" onclick="confirmFrontStatus('Remove')" style="display:none; margin-top: 10px;">Remove from Front</button>
                <button class="btn" style="background: var(--border); color: var(--text-main); margin-top: 5px;" onclick="closeFrontAction()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // Automatically move data from the old app name to the new app name if on the same phone
if (!localStorage.getItem('sys_mem') && localStorage.getItem('nx_members')) {
    localStorage.setItem('sys_mem', localStorage.getItem('nx_members'));
    localStorage.setItem('sys_act', localStorage.getItem('nx_active'));
    localStorage.setItem('sys_thm', localStorage.getItem('nx_theme'));
}
        let activeDataRaw = JSON.parse(localStorage.getItem('nx_active')) || [];
        let activeDataMigrated = activeDataRaw.map(item => typeof item === 'string' ? { name: item, status: 'Primary Fronter' } : item);

        let state = {
            members: JSON.parse(localStorage.getItem('nx_members')) || [],
            history: JSON.parse(localStorage.getItem('nx_history')) || [],
            activeFronters: activeDataMigrated,
            theme: localStorage.getItem('nx_theme') || 'dark'
        };

        let currentPfpBuffer = "";
        let currentActionIndex = -1;

        window.onload = () => { applyTheme(state.theme); renderAll(); if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); };

        function save() { localStorage.setItem('nx_members', JSON.stringify(state.members)); localStorage.setItem('nx_history', JSON.stringify(state.history)); localStorage.setItem('nx_active', JSON.stringify(state.activeFronters)); localStorage.setItem('nx_theme', state.theme); }

        function switchTab(tabId, event) { document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); document.getElementById(tabId).classList.add('active'); if(event) event.currentTarget.classList.add('active'); }

        function openFrontAction(index) {
            currentActionIndex = index;
            const member = state.members[index];
            document.getElementById('fa-name').innerText = member.name;
            const activeIdx = state.activeFronters.findIndex(f => f.name === member.name);
            document.getElementById('fa-remove-btn').style.display = activeIdx > -1 ? 'block' : 'none';
            document.getElementById('front-action-modal').style.display = 'flex';
        }

        function closeFrontAction() { document.getElementById('front-action-modal').style.display = 'none'; document.getElementById('fa-custom-status').value = ''; }

        function confirmFrontStatus(actionType) {
            const member = state.members[currentActionIndex];
            const activeIdx = state.activeFronters.findIndex(f => f.name === member.name);
            
            let finalStatus = actionType;
            if (actionType === 'Custom') {
                const customInput = document.getElementById('fa-custom-status').value.trim();
                if (!customInput) return; // Do nothing if the box is empty
                finalStatus = customInput;
            }

            if (finalStatus === 'Remove') {
                if (activeIdx > -1) { state.activeFronters.splice(activeIdx, 1); addLog(member.name, "Left Front"); }
            } else {
                if (activeIdx > -1) { state.activeFronters[activeIdx].status = finalStatus; addLog(member.name, `Switched to ${finalStatus}`); } 
                else { state.activeFronters.unshift({ name: member.name, status: finalStatus }); addLog(member.name, `Joined as ${finalStatus}`); }
            }

            save(); renderAll(); closeFrontAction();
        }

        function clearFront() { state.activeFronters = []; addLog("System", "Cleared all fronters"); save(); renderAll(); }
        function addLog(name, action) { state.history.unshift({ name, action, time: new Date().toLocaleString() }); if(state.history.length > 50) state.history.pop(); }

        document.getElementById('m-pfp').addEventListener('change', e => { const file = e.target.files[0]; const reader = new FileReader(); reader.onloadend = () => { currentPfpBuffer = reader.result; }; if (file) reader.readAsDataURL(file); });
        function openMemberModal(index = -1) { document.getElementById('member-modal').style.display = 'flex'; if(index > -1) { const m = state.members[index]; document.getElementById('edit-index').value = index; document.getElementById('m-name').value = m.name; document.getElementById('m-role').value = m.role || ''; currentPfpBuffer = m.pfp || ''; } else { document.getElementById('member-form').reset(); document.getElementById('edit-index').value = -1; currentPfpBuffer = ""; } }
        function closeMemberModal() { document.getElementById('member-modal').style.display = 'none'; }
        
        document.getElementById('member-form').addEventListener('submit', (e) => { e.preventDefault(); const idx = parseInt(document.getElementById('edit-index').value); const memberData = { name: document.getElementById('m-name').value, role: document.getElementById('m-role').value, pfp: currentPfpBuffer }; if(idx > -1) state.members[idx] = memberData; else state.members.push(memberData); save(); closeMemberModal(); renderAll(); });
        function deleteMember(index) { if(confirm("Delete this profile?")) { const memberName = state.members[index].name; state.members.splice(index, 1); state.activeFronters = state.activeFronters.filter(f => f.name !== memberName); save(); renderAll(); } }

        function renderAll() { renderFronters(); renderDirectory(); renderQuickSwitch(); renderLogs(); }

        function renderFronters() {
            const container = document.getElementById('active-fronters-list');
            container.innerHTML = state.activeFronters.length === 0 ? `<div style="color:var(--text-dim)">No one is currently fronting.</div>` : '';
            state.activeFronters.forEach(fData => {
                const m = state.members.find(mem => mem.name === fData.name);
                const isPrimary = fData.status === 'Primary Fronter';
                const badgeColor = isPrimary ? 'var(--accent)' : 'var(--text-dim)';
                const div = document.createElement('div'); div.className = 'card flex-between'; div.style.padding = '15px'; div.style.marginBottom = '0';
                const img = m?.pfp ? `<img src="${m.pfp}" style="width:50px; height:50px; border-radius:50%; object-fit:cover; border: 2px solid ${badgeColor};">` : `<div style="width:50px; height:50px; display:flex; align-items:center; justify-content:center; background:var(--card); border: 2px solid ${badgeColor}; border-radius:50%;">${fData.name[0]}</div>`;
                div.innerHTML = `<div style="display:flex; align-items:center; gap:15px;">${img}<div><div style="font-weight:bold; font-size:1.1rem;">${fData.name}</div><div style="font-size:0.8rem; color:var(--text-dim); margin-top: 4px;"><span class="badge" style="background: rgba(255,255,255,0.1); color: ${badgeColor}; border: 1px solid ${badgeColor};">${fData.status}</span></div></div></div>`;
                container.appendChild(div);
            });
        }

        function renderDirectory() {
            const grid = document.getElementById('directory-grid'); grid.innerHTML = '';
            state.members.forEach((m, i) => {
                const card = document.createElement('div'); card.className = 'member-card';
                const img = m.pfp ? `<img src="${m.pfp}" class="member-pfp">` : `<div class="member-pfp" style="display:flex; align-items:center; justify-content:center; background:#333;">${m.name[0]}</div>`;
                card.innerHTML = `<div class="member-banner"></div><div class="member-content">${img}<div class="member-name">${m.name}</div><div style="font-size: 0.8rem; color: var(--text-dim); margin-bottom: 10px;">${m.role || 'System Member'}</div><div style="display:flex; gap:5px;"><button class="btn btn-outline" style="flex:1; padding:5px;" onclick="openMemberModal(${i})">Edit</button><button class="btn btn-danger" style="flex:1; padding:5px;" onclick="deleteMember(${i})">Delete</button></div></div>`;
                grid.appendChild(card);
            });
        }

        function renderQuickSwitch() {
            const grid = document.getElementById('quick-grid'); grid.innerHTML = '';
            state.members.forEach((m, i) => {
                const activeData = state.activeFronters.find(f => f.name === m.name);
                const isActive = !!activeData;
                const card = document.createElement('div'); card.className = 'card flex-between'; card.style = `padding: 15px; margin-bottom: 0; cursor: pointer; border-left: 4px solid ${isActive ? 'var(--accent)' : 'transparent'};`;
                card.onclick = () => openFrontAction(i);
                const img = m.pfp ? `<img src="${m.pfp}" style="width:40px; height:40px; border-radius:8px; object-fit:cover;">` : `<div style="width:40px; height:40px; background:#333; border-radius:8px; display:flex; align-items:center; justify-content:center;">${m.name[0]}</div>`;
                card.innerHTML = `<div style="display:flex; align-items:center; gap:12px;">${img}<div><div style="font-weight:bold; font-size:0.95rem;">${m.name}</div></div></div><div style="color: ${isActive ? 'var(--accent)' : 'var(--text-dim)'}; font-size: 0.75rem; font-weight: 800; text-align: right;">${isActive ? activeData.status.toUpperCase() : 'OFFLINE'}</div>`;
                grid.appendChild(card);
            });
        }

        function renderLogs() { const tbody = document.getElementById('history-log-body'); tbody.innerHTML = ''; state.history.forEach(log => { tbody.innerHTML += `<tr><td style="font-weight:bold">${log.name}</td><td>${log.action}</td><td style="color:var(--text-dim)">${log.time}</td></tr>`; }); }
        function clearLogs() { if(confirm("Clear history?")) { state.history = []; save(); renderLogs(); } }
        function changeTheme(t) { state.theme = t; applyTheme(t); save(); }
        function applyTheme(t) { document.body.setAttribute('data-theme', t); document.getElementById('theme-selector').value = t; }
        function generateKey() { document.getElementById('system-key-box').value = btoa(unescape(encodeURIComponent(JSON.stringify(state)))); }
        function importData() {
    let rawInput = prompt("Paste your Backup Code or System Key here:");
    if (!rawInput) return;

    let parsedData = null;

    // STEP 1: Try to read it as the "lot of code" (Raw JSON)
    try {
        parsedData = JSON.parse(rawInput);
    } catch (e) {
        // STEP 2: Try to read it as the "Complex" Base64 from the index.html.html version
        try {
            parsedData = JSON.parse(decodeURIComponent(escape(atob(rawInput))));
        } catch (e2) {
            // STEP 3: Try to read it as the "Simple" Short Key
            try {
                parsedData = JSON.parse(atob(rawInput));
            } catch (e3) {
                alert("Could not read this code. Make sure you copied the entire thing!");
                return;
            }
        }
    }

    if (parsedData && confirm("Data found! Do you want to overwrite your current account with this backup?")) {
        // This part 'translates' the old names to the new names automatically
        state.members = parsedData.members || parsedData.nx_members || [];
        state.activeFronters = parsedData.activeFronters || parsedData.nx_active || parsedData.active || [];
        state.history = parsedData.history || parsedData.nx_history || [];
        state.theme = parsedData.theme || parsedData.nx_theme || parsedData.sys_thm || 'dark';
        
        save();
        location.reload(); // Refresh to show the new data
    }
}
    </script>
</body>
</html>
